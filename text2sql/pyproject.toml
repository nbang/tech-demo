[project]
name = "text2sql"
version = "0.1.0"
description = "Natural-language to SQL for Postgres, powered by a self-hosted open-source LLM (Ollama) with schema-RAG."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
text2sql = "text2sql.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["text2sql"]
