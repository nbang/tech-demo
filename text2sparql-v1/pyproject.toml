[project]
name = "text2sparql"
version = "0.1.0"
description = "Natural-language to SPARQL for RDF / knowledge graphs, powered by a self-hosted open-source LLM (Ollama) with ontology-RAG."
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
text2sparql = "text2sparql.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["text2sparql"]
